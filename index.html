<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compteur d'Heures</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com; style-src 'self'; frame-ancestors 'none';">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button>salut

    </button>
    <div class="container">
        <div class="balance-card">
            <h2>Solde Actuel</h2>
            <div id="totalBalance" class="balance-value">0h00</div>
            <p id="balanceText">Aucune heure enregistrée</p>
        </div>

        <div class="form-card">
            <form id="hourForm">
                <div class="input-group no-motif">
                    <select id="type" required>
                        <option value="plus">Heures faites (+)</option>
                        <option value="minus">Heures récupérées (-)</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="number" id="hours" placeholder="Heures" min="0" required>
                    <input type="number" id="minutes" placeholder="Minutes" min="0" max="59" required>
                </div>
                <button type="submit">Enregistrer</button>
            </form>
        </div>

        <button id="exportBtn" class="btn-secondary" style="margin-bottom: 20px;">Exporter en Excel</button>

        <h3>Historique</h3>
        <ul id="history" class="history-list"></ul>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="script.js" defer></script>
</body>

</html>
