<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compteur d'Heures</title>


    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="balance-card">
            <h2>Solde Actuel</h2>
            <div id="totalBalance" class="balance-value">0h00</div>
            <p id="balanceText">Aucune heure enregistrée</p>
        </div>

        <div class="form-card">
            <form id="hourForm">
                <div class="input-group no-motif">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="entryType" value="plus" checked>
                            <span class="radio-btn">Heures supp (+)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="entryType" value="minus">
                            <span class="radio-btn">Heures récup (-)</span>
                        </label>
                    </div>
                </div>
                <div class="input-group">
                    <input type="number" id="hours" placeholder="Heures" min="0" required>
                    <input type="number" id="minutes" placeholder="Minutes" min="0" max="59" required>
                </div>
                <button type="submit">Enregistrer</button>
            </form>
        </div>

        <button id="exportBtn" class="btn-secondary">Exporter en CSV</button>

        <details class="history-container">
            <summary>Voir l'historique</summary>
            <ul id="history" class="history-list"></ul>
        </details>
    </div>


    <script src="script.js" defer></script>
</body>

</html>
