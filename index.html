<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compteur d'Heures</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            margin: 5rem;
            width: 100%;
            max-width: 500px;
        }

        .balance-card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
        }

        .balance-value {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .positive {
            color: var(--success);
        }

        .negative {
            color: var(--danger);
        }

        .form-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group.no-motif {
            grid-template-columns: 1fr;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .history-list {
            list-style: none;
            padding: 0;
        }

        .history-item {
            background: var(--card);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #cbd5e1;
        }

        .item-plus {
            border-left-color: var(--success);
        }

        .item-minus {
            border-left-color: var(--danger);
        }

        .delete-btn {
            background: none;
            color: #94a3b8;
            border: none;
            width: auto;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="balance-card">
            <h2>Solde Actuel</h2>
            <div id="totalBalance" class="balance-value">0h00</div>
            <p id="balanceText">Aucune heure enregistrée</p>
        </div>

        <div class="form-card">
            <form id="hourForm">
                <div class="input-group no-motif">
                    <select id="type" required>
                        <option value="plus">Heures faites (+)</option>
                        <option value="minus">Heures récupérées (-)</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="number" id="hours" placeholder="Heures" min="0" required>
                    <input type="number" id="minutes" placeholder="Minutes" min="0" max="59" required>
                </div>
                <button type="submit">Enregistrer</button>
            </form>
        </div>

        <h3>Historique</h3>
        <ul id="history" class="history-list"></ul>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('overtimeData')) || [];

        const form = document.getElementById('hourForm');
        const historyList = document.getElementById('history');
        const totalDisplay = document.getElementById('totalBalance');

        function saveAndRender() {
            localStorage.setItem('overtimeData', JSON.stringify(entries));
            render();
        }

        function formatTime(totalMinutes) {
            const absMinutes = Math.abs(totalMinutes);
            const h = Math.floor(absMinutes / 60);
            const m = absMinutes % 60;
            const sign = totalMinutes < 0 ? "-" : (totalMinutes > 0 ? "+" : "");
            return `${sign}${h}h${m.toString().padStart(2, '0')}`;
        }

        function render() {
            // Calcul du total
            let totalMinutes = entries.reduce((acc, entry) => {
                return entry.type === 'plus' ? acc + entry.value : acc - entry.value;
            }, 0);

            // Affichage du total
            totalDisplay.innerText = formatTime(totalMinutes);
            totalDisplay.className = 'balance-value ' + (totalMinutes >= 0 ? 'positive' : 'negative');

            // Affichage de l'historique
            historyList.innerHTML = '';
            entries.slice().reverse().forEach((entry, index) => {
                const realIndex = entries.length - 1 - index;
                const li = document.createElement('li');
                li.className = `history-item ${entry.type === 'plus' ? 'item-plus' : 'item-minus'}`;
                li.innerHTML = `
                <div>
                    <strong>${entry.type === 'plus' ? 'Heures faites' : 'Heures récupérées'}</strong><br>
                    <small>${entry.date}</small>
                </div>
                <div>
                    <span>${entry.type === 'plus' ? '+' : '-'}${Math.floor(entry.value / 60)}h${(entry.value % 60).toString().padStart(2, '0')}</span>
                    <button class="delete-btn" onclick="deleteEntry(${realIndex})">×</button>
                </div>
            `;
                historyList.appendChild(li);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const h = parseInt(document.getElementById('hours').value) || 0;
            const m = parseInt(document.getElementById('minutes').value) || 0;

            const newEntry = {
                type: document.getElementById('type').value,
                value: (h * 60) + m,
                date: new Date().toLocaleDateString('fr-FR')
            };

            entries.push(newEntry);
            form.reset();
            saveAndRender();
        });

        function deleteEntry(index) {
            entries.splice(index, 1);
            saveAndRender();
        }

        // Premier rendu au chargement
        render();
    </script>

</body>

</html>
